<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Kroki-rs Native Browser Engine</title>
</head>

<body>
    <div id="graphDiv"></div>
    <div id="container"></div>
    <script>
        // Global state
        window.kroki = {
            isPlantUmlInitialized: false,

            async initPlantUml() {
                if (this.isPlantUmlInitialized) return;
                if (typeof cheerpjInit === 'undefined') {
                    throw new Error("CheerpJ loader not found. Link https://cjrtnc.leaningtech.com/2.0/loader.js first.");
                }
                await cheerpjInit();
                this.isPlantUmlInitialized = true;
            },

            async renderMermaid(source) {
                if (!window.mermaid) throw new Error("Mermaid library not loaded");
                document.body.innerHTML = '<div id="graphDiv"></div>';
                window.mermaid.initialize({ startOnLoad: false });
                const { svg } = await window.mermaid.render('mermaid-' + Date.now(), source);
                return svg;
            },

            async renderBpmn(source) {
                if (!window.BpmnJS) throw new Error("BpmnJS library not loaded");
                document.body.innerHTML = '<div id="container"></div>';
                return new Promise((resolve, reject) => {
                    const viewer = new window.BpmnJS({ container: '#container' });
                    viewer.importXML(source).then(() => {
                        viewer.saveSVG({ format: true }).then((r) => resolve(r.svg)).catch(reject);
                    }).catch(reject);
                });
            },

            async renderPlantUml(source) {
                await this.initPlantUml();
                // API: com.plantuml.api.cheerpj.v1.Svg.convert("light", text)
                return await cjCall("com.plantuml.api.cheerpj.v1.Svg", "convert", "light", source);
            }
        };
    </script>
</body>

</html>
