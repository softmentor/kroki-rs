[package]
name = "kroki-rs"
version = "0.0.2"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
which = "7.0"
base64 = "0.22"
flate2 = "1.0"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tempfile = "3.10"
dirs = "4.0"
sha2 = "0.10"
hex = "0.4"
walkdir = "2.4"
resvg = { version = "0.42.0", default-features = false, features = ["text", "system-fonts"] }
image = { version = "0.25", default-features = false, features = ["webp"] }
# Optional experimental support
# rustyscript = { version = "0.1", optional = true }

# Optimize dependencies even in debug/test mode to dramatically speed up image encoding
[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3
