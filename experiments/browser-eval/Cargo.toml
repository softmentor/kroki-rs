[package]
name = "browser-eval"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
futures = "0.3"
base64 = "0.22"
image = "0.25"
time = "0.3"

chromiumoxide = { version = "0.7", features = ["tokio-runtime"], optional = true }
headless_chrome = { version = "1.0", optional = true }
fantoccini = { version = "0.21", optional = true }

[features]
default = []
feat_chromiumoxide = ["dep:chromiumoxide"]
feat_headless_chrome = ["dep:headless_chrome"]
feat_fantoccini = ["dep:fantoccini"]
