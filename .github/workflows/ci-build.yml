# Continuous Integration (PR-Gate)
# Runs inside the fingerprinted CI container for 100% parity with local repro (repro-ci.sh).
name: CI-Build

on:
  push:
    branches: [ "main" ]
    tags-ignore: [ "v*" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # Job 1: Build dependencies and the application
  build:
    name: "Build"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: "CI: Registry Check"
        id: registry_check
        run: |
          FINGERPRINT=$(openssl dgst -sha256 Dockerfile 2>/dev/null | sed 's/.* //' | cut -c1-12)
          IMAGE="ghcr.io/${{ github.repository }}-ci:$FINGERPRINT"
          echo "fingerprint=$FINGERPRINT" >> $GITHUB_OUTPUT
          if docker pull "$IMAGE" 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        if: steps.registry_check.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.registry_check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to the Container registry
        if: steps.registry_check.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build-on-Demand: Build and push CI image"
        if: steps.registry_check.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-ci:${{ steps.registry_check.outputs.fingerprint }}
            ghcr.io/${{ github.repository }}-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Podman
        run: |
          sudo apt-get update && sudo apt-get install -y podman

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.3

      - name: Cache Cargo (registry, git, target)
        uses: actions/cache@v4
        with:
          path: |
            .cargo-cache/registry
            .cargo-cache/git
            target
          # Using run_id ensures we can save the cache and have it be distinct, 
          # while restore-keys allows us to pick up the latest valid one.
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: "CI: Build"
        run: ./dflow ci-verify build

  # Job 2: Lint and Format
  lint-fmt:
    name: "Lint & Format"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Cache Cargo (Restore)
        uses: actions/cache/restore@v4
        with:
          path: |
            .cargo-cache/registry
            .cargo-cache/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
      - name: "CI: Format Check"
        run: ./dflow ci-verify fmt
      - name: "CI: Lint (Clippy)"
        run: ./dflow ci-verify lint

  # Job 3: Tests
  tests:
    name: "Tests (nextest)"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Cache Cargo (Restore)
        uses: actions/cache/restore@v4
        with:
          path: |
            .cargo-cache/registry
            .cargo-cache/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
      - name: "CI: Tests"
        run: ./dflow ci-verify test-ci

  # Job 4: Smoke Test and Final Verification
  smoke-verify:
    name: "Smoke & Verify"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Cache Cargo (Restore)
        uses: actions/cache/restore@v4
        with:
          path: |
            .cargo-cache/registry
            .cargo-cache/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
      - name: "CI: Smoke Test"
        run: ./dflow ci-verify smoke-test
      - name: "CI: Final Verification"
        run: ./dflow ci-verify verify
