# Continuous Integration (PR-Gate)
# 3-phase pipeline: Prep (image resolution) → Build (cache warmup) → Verify (parallel checks).
# ALL Rust steps run inside the fingerprinted CI container for 100% parity with local repro.
# Local equivalent: ./dflow ci-verify  (uses same image, same make targets, consistent paths)
#
# Job graph:
#   prep ──► build ──► lint          (fmt-check + clippy, parallel with test/smoke-verify)
#        │          ├──► test         (nextest, parallel with lint/smoke-verify)
#        │          └──► smoke-verify (smoke-test + dist verify, parallel with lint/test)
#        └──────────────────────────── (prep also feeds image tag to all container jobs)
#
# Cache key: cargo-<runner.os>-<Cargo.lock + rust-toolchain hash>
#   - Invalidates on dep changes (Cargo.lock) or toolchain bump (rust-toolchain.toml)
#   - No run_id suffix: enables cross-run reuse on same branch
#   - Build job saves; Verify jobs restore read-only

name: CI-Build

on:
  push:
    branches: [ "main" ]
    tags-ignore: [ "v*" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - '.DS_Store'
      - 'LICENSE'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - '.DS_Store'
      - 'LICENSE'

env:
  SCCACHE_GHA_ENABLED: "false"
  RUSTC_WRAPPER: "sccache"
  GITHUB_ACTIONS: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Phase 1 — Prep: resolve the CI image once, output fingerprint for all jobs
  # Runs on bare runner (~15s). Handles image tar caching so container jobs
  # pull from the runner's Docker daemon (fast) rather than GHCR (slow).
  # ---------------------------------------------------------------------------
  prep:
    name: "Prep"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      packages: write
    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.hash }}
    steps:
      - uses: actions/checkout@v4

      - name: "Verify Version Sync"
        run: ./dflow ci-verify --version-check

      - name: "Login to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Compute CI Image Fingerprint"
        id: fingerprint
        run: |
          HASH=$(make -s print-base-fingerprint)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "📌 Fingerprint: $HASH"

      - name: "Prune Redundant Caches"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash src-scripts/gh-tasks/prune-gha-cache.sh

      # Image tar cache — keyed on Dockerfile hash (same as fingerprint but explicit)
      # Saves ~30-60s image pull time for every downstream container job.
      - name: "Cache CI Image Tar"
        id: image_tar_cache
        uses: actions/cache@v4
        with:
          path: ci-image.tar
          key: docker-ci-${{ hashFiles('Dockerfile') }}

      - name: "Ensure CI Image Available"
        id: ensure_image
        run: |
          FINGERPRINT="${{ steps.fingerprint.outputs.hash }}"
          IMAGE="ghcr.io/${{ github.repository }}-ci:${FINGERPRINT}"

          # 1. Load from tar cache (fastest — avoids any network)
          if [ -f ci-image.tar ]; then
            echo "📦 Loading CI image from cache tar..."
            docker load -i ci-image.tar
            echo "✅ Image loaded from cache."
            exit 0
          fi

          # 2. Check if image exists in GHCR (normal path after base-image.yml has run)
          echo "🔍 Checking GHCR for image..."
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "✅ Image $IMAGE found in GHCR. Pulling to local daemon..."
            docker pull "$IMAGE"
            docker save -o ci-image.tar "$IMAGE"
            exit 0
          fi

          # 3. Build-on-demand fallback: PUSH to GHCR so downstream container jobs can pull it.
          # This ensures PRs with Dockerfile changes are verified correctly.
          echo "⚠️  Image not in GHCR. Building and Pushing on-demand (amd64)..."
          docker buildx build \
            --push \
            --target ci \
            --build-arg RUST_VERSION="$(make -s print-rust-version)" \
            -t "$IMAGE" \
            .
          
          # Pull back to local for the docs-verify step in this job
          docker pull "$IMAGE"
          docker save -o ci-image.tar "$IMAGE"
          echo "✅ Build and Push complete."

      - name: "Verify Documentation (MyST)"
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || contains(github.ref, 'release/')
        run: |
          FINGERPRINT="${{ steps.fingerprint.outputs.hash }}"
          IMAGE="ghcr.io/${{ github.repository }}-ci:${FINGERPRINT}"
          docker run --rm -v "$(pwd):/app" -w /app "$IMAGE" make doc-myst

  # ---------------------------------------------------------------------------
  # Phase 2 — Build: compile all targets in release mode inside the CI container.
  # Warms the cargo/sccache cache; saves it for all downstream Verify jobs.
  # Only compilation — clippy runs separately in the Lint job for clear PR status.
  # ---------------------------------------------------------------------------
  build:
    name: "Build"
    needs: prep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}-ci:${{ needs.prep.outputs.fingerprint }}
      options: --security-opt seccomp=unconfined
    env:
      IS_CONTAINER: "true"
      CARGO_HOME: ${{ github.workspace }}/.cargo-cache
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci
      SCCACHE_DIR: ${{ github.workspace }}/.cargo-cache/sccache
      SCCACHE_GHA_ENABLED: "false"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4

      - name: "Git Safety"
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Restore + save: Build is the only job that writes the cargo cache.
      # Key has no run_id — enables cross-run reuse when deps+toolchain unchanged.
      - name: "Restore/Save Cargo Cache"
        uses: actions/cache@v4
        with:
          path: |
            .cargo-cache/registry
            .cargo-cache/git
            .cargo-cache/sccache
            target/ci
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # build-ci = cargo build --release --all-targets (no clippy)
      # Compiles all crates including test targets so Verify jobs hit the cache.
      - name: "Build All Release Targets"
        run: ./dflow ci-verify build-ci

      # Container jobs run as root; cache post-step runs as runner user.
      # Make cached dirs world-readable so the cache action can upload them.
      - name: "Fix Cache Permissions"
        if: always()
        run: chmod -R a+rw .cargo-cache target/ci || true

  # ---------------------------------------------------------------------------
  # Phase 3 — Verify: Single job pulled once, reporting multiple PR checks via API.
  # All checks run in parallel inside the SAME container instance.
  # ---------------------------------------------------------------------------
  verify:
    name: "Verify"
    needs: [prep, build]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-ci:${{ needs.prep.outputs.fingerprint }}
      options: --security-opt seccomp=unconfined
    permissions:
      contents: read
      actions: read
      checks: write
      statuses: write
      packages: read
    env:
      IS_CONTAINER: "true"
      CARGO_HOME: ${{ github.workspace }}/.cargo-cache
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci
      SCCACHE_DIR: ${{ github.workspace }}/.cargo-cache/sccache
      SCCACHE_GHA_ENABLED: "false"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4

      - name: "Git Safety"
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: "Restore Cargo Cache"
        uses: actions/cache/restore@v4
        with:
          path: |
            .cargo-cache/registry
            .cargo-cache/git
            .cargo-cache/sccache
            target/ci
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: "Execute Concurrent PR Checks"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          chmod +x src-scripts/gh-tasks/gh-check-wrapper.sh
          
          # Define checks as background tasks
          # Wrap each in gh-check-wrapper to emit fine-grained PR statuses
          
          bash src-scripts/gh-tasks/gh-check-wrapper.sh "fmt" \
            "cargo fmt --all -- --check" &
          
          bash src-scripts/gh-tasks/gh-check-wrapper.sh "clippy" \
            "cargo clippy --release --all-targets --features native-browser -- -D warnings" &
          
          bash src-scripts/gh-tasks/gh-check-wrapper.sh "test" \
            "./dflow ci-verify test-ci" &
          
          bash src-scripts/gh-tasks/gh-check-wrapper.sh "smoke-test" \
            "bash -c './dflow ci-verify smoke-test && ./dflow ci-verify verify'" &
          
          # Wait for all background checks to complete
          wait
