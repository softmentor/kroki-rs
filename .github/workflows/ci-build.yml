# Continuous Integration (PR-Gate)
# Runs inside the fingerprinted CI container for 100% parity with local repro (repro-ci.sh).
name: CI-Build

on:
  push:
    branches: [ "main" ]
    tags-ignore: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci-verify:
    name: full-parity-verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Cache Cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      - name: "CI: Format Check"
        run: ./dflow ci-verify fmt

      - name: "CI: Lint (Clippy)"
        run: ./dflow ci-verify lint

      - name: "CI: Build"
        run: ./dflow ci-verify build

      - name: "CI: Tests"
        run: ./dflow ci-verify test-ci

      - name: "CI: Smoke Test"
        run: ./dflow ci-verify smoke-test

      - name: "CI: Final Verification"
        run: ./dflow ci-verify verify
