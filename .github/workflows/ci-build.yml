# Continuous Integration (PR-Gate)
# Runs inside the fingerprinted CI container for 100% parity with local repro (repro-ci.sh).
name: CI-Build

on:
  push:
    branches: [ "main" ]
    tags-ignore: [ "v*" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - '.DS_Store'
      - 'LICENSE'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - '.DS_Store'
      - 'LICENSE'

env:
  SCCACHE_GHA_ENABLED: "false"
  RUSTC_WRAPPER: "sccache"

jobs:
  # Job 1: Build dependencies and the application
  build:
    name: "Build"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      packages: write
    outputs:
      fingerprint: ${{ steps.image_logic.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v4

      - name: "CI: Prune Redundant Caches"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash src-scripts/gh-tasks/prune-gha-cache.sh

      - name: "CI: Registry Check & Image Cache"
        id: image_cache
        uses: actions/cache@v4
        with:
          path: ci-image.tar
          key: ${{ runner.os }}-docker-image-${{ hashFiles('Dockerfile') }}

      - name: "CI: Load or Build Image"
        id: image_logic
        run: |
          FINGERPRINT=$(make -s print-base-fingerprint)
          IMAGE="ghcr.io/${{ github.repository }}-ci:$FINGERPRINT"
          echo "fingerprint=$FINGERPRINT" >> $GITHUB_OUTPUT
          
          # 1. Try Loading from Cache
          if [ -f ci-image.tar ]; then
            echo "📦 Loading image from cache..."
            docker load -i ci-image.tar
            echo "loaded=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # 2. Try Pulling from GHCR
          if docker pull "$IMAGE" 2>/dev/null; then
            echo "✅ Image $FINGERPRINT found in registry."
            docker save -o ci-image.tar "$IMAGE"
            echo "loaded=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # 3. Build-on-Demand (Safe Fallback)
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "loaded=false" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        if: steps.image_logic.outputs.loaded == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.image_logic.outputs.loaded == 'false'
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to the Container registry
        if: steps.image_logic.outputs.loaded == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build-on-Demand: Build and push CI image"
        if: steps.image_logic.outputs.loaded == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-ci:${{ steps.image_logic.outputs.fingerprint }}
            ghcr.io/${{ github.repository }}-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Post-Build: Save Image to Cache"
        if: steps.image_logic.outputs.loaded == 'false'
        run: |
          IMAGE="ghcr.io/${{ github.repository }}-ci:${{ steps.image_logic.outputs.fingerprint }}"
          echo "📦 Pulling built image to local daemon for caching..."
          docker pull "$IMAGE"
          docker save -o ci-image.tar "$IMAGE"

      - name: Cache Cargo (registry, git, target/ci, sccache)
        uses: actions/cache@v4
        with:
          path: |
            .cargo-cache/registry
            .cargo-cache/git
            .cargo-cache/sccache
            target/ci
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: "CI: Build (Pre-warm sccache)"
        run: ./dflow ci-verify build-all

  # Job 2: Format Check
  fmt:
    name: "fmt"
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-ci:${{ needs.build.outputs.fingerprint }}
    env:
      IS_CONTAINER: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo (Restore target/ci and sccache)
        uses: actions/cache/restore@v4
        with:
          path: |
            .cargo-cache/registry
            .cargo-cache/git
            .cargo-cache/sccache
            target/ci
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-

      - name: "CI: Format Check"
        run: ./dflow ci-verify fmt

  # Job 3: Clippy (Lint)
  clippy:
    name: "clippy"
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-ci:${{ needs.build.outputs.fingerprint }}
    env:
      IS_CONTAINER: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo (Restore target/ci and sccache)
        uses: actions/cache/restore@v4
        with:
          path: |
            .cargo-cache/registry
            .cargo-cache/git
            .cargo-cache/sccache
            target/ci
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-

      - name: "CI: Lint (Clippy)"
        run: ./dflow ci-verify lint

  # Job 4: Tests
  test:
    name: "test"
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-ci:${{ needs.build.outputs.fingerprint }}
    env:
      IS_CONTAINER: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo (Restore target/ci and sccache)
        uses: actions/cache/restore@v4
        with:
          path: |
            .cargo-cache/registry
            .cargo-cache/git
            .cargo-cache/sccache
            target/ci
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-

      - name: "CI: Tests"
        run: ./dflow ci-verify test-ci

  # Job 5: Smoke Test and Final Verification
  smoke-test:
    name: "smoke-test"
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-ci:${{ needs.build.outputs.fingerprint }}
    env:
      IS_CONTAINER: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo (Restore target/ci and sccache)
        uses: actions/cache/restore@v4
        with:
          path: |
            .cargo-cache/registry
            .cargo-cache/git
            .cargo-cache/sccache
            target/ci
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-

      - name: "CI: Smoke Test"
        run: ./dflow ci-verify smoke-test
      - name: "CI: Final Verification"
        run: ./dflow ci-verify verify
