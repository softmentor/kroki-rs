# Continuous Integration (PR-Gate)
# 3-phase pipeline: Prep (image resolution) → Build (cache warmup) → Verify (parallel checks).
# ALL Rust steps run inside the fingerprinted CI container for 100% parity with local repro.
# Local equivalent: ./dflow ci-verify  (uses same image, same make targets, consistent paths)
#
# Job graph:
#   prep ──► build ──► lint          (fmt-check + clippy, parallel with test/smoke-verify)
#        │          ├──► test         (nextest, parallel with lint/smoke-verify)
#        │          └──► smoke-verify (smoke-test + dist verify, parallel with lint/test)
#        └──────────────────────────── (prep also feeds image tag to all container jobs)
#
# Cache key: cargo-<runner.os>-<Cargo.lock+rust-toolchain hash>
#   - Invalidates on dep changes (Cargo.lock) or toolchain bump (rust-toolchain.toml)
#   - No run_id suffix: enables cross-run reuse on same branch
#   - Build job saves; Verify jobs restore read-only

name: CI-Build

on:
  push:
    branches: [ "main" ]
    tags-ignore: [ "v*" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - '.DS_Store'
      - 'LICENSE'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - '.DS_Store'
      - 'LICENSE'

# Shared env for all container jobs (see x-container-env anchor below)
env:
  SCCACHE_GHA_ENABLED: "false"
  RUSTC_WRAPPER: "sccache"

# ---------------------------------------------------------------------------
# Reusable YAML anchors
# ---------------------------------------------------------------------------
x-container-env: &container-env
  IS_CONTAINER: "true"
  # CARGO_HOME: workspace-relative so cache action and cargo see the same path
  CARGO_HOME: ${{ github.workspace }}/.cargo-cache
  # CARGO_TARGET_DIR: workspace-relative — identical absolute path in Build and
  # all Verify jobs, so cargo fingerprints recorded during Build are valid on restore
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci
  SCCACHE_DIR: ${{ github.workspace }}/.cargo-cache/sccache
  SCCACHE_GHA_ENABLED: "false"
  RUSTC_WRAPPER: "sccache"

x-cargo-cache-paths: &cargo-cache-paths |
  .cargo-cache/registry
  .cargo-cache/git
  .cargo-cache/sccache
  target/ci

x-cargo-cache-key: &cargo-cache-key >-
  cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

x-cargo-restore-keys: &cargo-restore-keys |
  cargo-${{ runner.os }}-

jobs:
  # ---------------------------------------------------------------------------
  # Phase 1 — Prep: resolve the CI image once, output fingerprint for all jobs
  # Runs on bare runner (~15s). Handles image tar caching so container jobs
  # pull from the runner's Docker daemon (fast) rather than GHCR (slow).
  # ---------------------------------------------------------------------------
  prep:
    name: "Prep"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      packages: write
    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.hash }}
    steps:
      - uses: actions/checkout@v4

      - name: "Compute CI Image Fingerprint"
        id: fingerprint
        run: |
          HASH=$(make -s print-base-fingerprint)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "📌 Fingerprint: $HASH"

      - name: "Prune Redundant Caches"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash src-scripts/gh-tasks/prune-gha-cache.sh

      # Image tar cache — keyed on Dockerfile hash (same as fingerprint but explicit)
      # Saves ~30-60s image pull time for every downstream container job.
      - name: "Cache CI Image Tar"
        id: image_tar_cache
        uses: actions/cache@v4
        with:
          path: ci-image.tar
          key: docker-ci-${{ hashFiles('Dockerfile') }}

      - name: "Ensure CI Image Available"
        id: ensure_image
        run: |
          FINGERPRINT="${{ steps.fingerprint.outputs.hash }}"
          IMAGE="ghcr.io/${{ github.repository }}-ci:${FINGERPRINT}"

          # 1. Load from tar cache (fastest — avoids any network)
          if [ -f ci-image.tar ]; then
            echo "📦 Loading CI image from cache tar..."
            docker load -i ci-image.tar
            echo "✅ Image loaded from cache."
            exit 0
          fi

          # 2. Pull from GHCR (normal path after base-image.yml has run)
          echo "🔍 Cache miss — pulling from GHCR..."
          if docker pull "$IMAGE" 2>/dev/null; then
            echo "✅ Pulled $IMAGE from GHCR. Saving tar for cache..."
            docker save -o ci-image.tar "$IMAGE"
            exit 0
          fi

          # 3. Build-on-demand fallback (amd64 only, no push)
          # Triggered when: Dockerfile changed in a PR before base-image.yml ran on main.
          # base-image.yml is the canonical builder; this is a convenience fallback only.
          echo "⚠️  Image not in GHCR. Building on-demand (amd64, no push)..."
          docker buildx build \
            --load \
            --target ci \
            --build-arg RUST_VERSION="$(make -s print-rust-version)" \
            -t "$IMAGE" \
            -t "ghcr.io/${{ github.repository }}-ci:latest" \
            .
          docker save -o ci-image.tar "$IMAGE"
          echo "✅ Build-on-demand complete. Tar saved for downstream jobs."

  # ---------------------------------------------------------------------------
  # Phase 2 — Build: compile all targets in release mode inside the CI container.
  # Warms the cargo/sccache cache; saves it for all downstream Verify jobs.
  # Only compilation — clippy runs separately in the Lint job for clear PR status.
  # ---------------------------------------------------------------------------
  build:
    name: "Build"
    needs: prep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}-ci:${{ needs.prep.outputs.fingerprint }}
      options: --security-opt seccomp=unconfined
    env:
      IS_CONTAINER: "true"
      CARGO_HOME: ${{ github.workspace }}/.cargo-cache
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci
      SCCACHE_DIR: ${{ github.workspace }}/.cargo-cache/sccache
      SCCACHE_GHA_ENABLED: "false"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4

      - name: "Git Safety"
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Restore + save: Build is the only job that writes the cargo cache.
      # Key has no run_id — enables cross-run reuse when deps+toolchain unchanged.
      - name: "Restore/Save Cargo Cache"
        uses: actions/cache@v4
        with:
          path: |
            .cargo-cache/registry
            .cargo-cache/git
            .cargo-cache/sccache
            target/ci
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # build-ci = cargo build --release --all-targets (no clippy)
      # Compiles all crates including test targets so Verify jobs hit the cache.
      - name: "Build All Release Targets"
        run: ./dflow ci-verify build-ci

      # Container jobs run as root; cache post-step runs as runner user.
      # Make cached dirs world-readable so the cache action can upload them.
      - name: "Fix Cache Permissions"
        if: always()
        run: chmod -R a+rw .cargo-cache target/ci || true

  # ---------------------------------------------------------------------------
  # Phase 3 — Verify: parallel jobs, each a separate PR check.
  # All restore cargo cache (read-only). None save — only Build saves.
  # ---------------------------------------------------------------------------

  lint:
    name: "Lint"
    needs: [prep, build]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-ci:${{ needs.prep.outputs.fingerprint }}
      options: --security-opt seccomp=unconfined
    env:
      IS_CONTAINER: "true"
      CARGO_HOME: ${{ github.workspace }}/.cargo-cache
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci
      SCCACHE_DIR: ${{ github.workspace }}/.cargo-cache/sccache
      SCCACHE_GHA_ENABLED: "false"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4

      - name: "Git Safety"
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: "Restore Cargo Cache"
        uses: actions/cache/restore@v4
        with:
          path: |
            .cargo-cache/registry
            .cargo-cache/git
            .cargo-cache/sccache
            target/ci
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # Two named steps = two visible entries in the job log.
      # If format fails, clippy step is skipped — clear which check failed.
      - name: "Format Check"
        run: cargo fmt --all -- --check

      - name: "Clippy"
        run: cargo clippy --release --all-targets --features native-browser -- -D warnings

  test:
    name: "Test"
    needs: [prep, build]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-ci:${{ needs.prep.outputs.fingerprint }}
      options: --security-opt seccomp=unconfined
    env:
      IS_CONTAINER: "true"
      CARGO_HOME: ${{ github.workspace }}/.cargo-cache
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci
      SCCACHE_DIR: ${{ github.workspace }}/.cargo-cache/sccache
      SCCACHE_GHA_ENABLED: "false"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4

      - name: "Git Safety"
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: "Restore Cargo Cache"
        uses: actions/cache/restore@v4
        with:
          path: |
            .cargo-cache/registry
            .cargo-cache/git
            .cargo-cache/sccache
            target/ci
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: "Tests (Nextest)"
        run: ./dflow ci-verify test-ci

  smoke-verify:
    name: "Smoke + Verify"
    needs: [prep, build]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-ci:${{ needs.prep.outputs.fingerprint }}
      options: --security-opt seccomp=unconfined
    env:
      IS_CONTAINER: "true"
      CARGO_HOME: ${{ github.workspace }}/.cargo-cache
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci
      SCCACHE_DIR: ${{ github.workspace }}/.cargo-cache/sccache
      SCCACHE_GHA_ENABLED: "false"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4

      - name: "Git Safety"
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: "Restore Cargo Cache"
        uses: actions/cache/restore@v4
        with:
          path: |
            .cargo-cache/registry
            .cargo-cache/git
            .cargo-cache/sccache
            target/ci
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # smoke-test depends on `release` (make target), which finds the cached binary.
      - name: "Smoke Test"
        run: ./dflow ci-verify smoke-test

      # verify depends on `dist` → `release` (make targets); uses cached release binary.
      - name: "Final Verification"
        run: ./dflow ci-verify verify
