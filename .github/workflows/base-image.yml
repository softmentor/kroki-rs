# Build Base and CI Images (content-addressable fingerprint)
# Pre-builds Docker images for local repro and GHA so both share the same environment.
name: Build Base Image

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'Dockerfile'
      - 'Makefile'
      - 'install.sh'
      - 'src-scripts/**'
      - '.github/workflows/base-image.yml'

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute fingerprint
        id: fingerprint
        run: |
          HASH=$( (cat Dockerfile Makefile install.sh 2>/dev/null; find src-scripts -type f ! -path "*/gh-tasks/*" 2>/dev/null | LC_ALL=C sort | xargs cat 2>/dev/null) | openssl dgst -sha256 2>/dev/null | sed 's/.* //' | cut -c1-12)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "Fingerprint: $HASH"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-base:${{ steps.fingerprint.outputs.hash }}
            ghcr.io/${{ github.repository }}-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push CI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-ci:${{ steps.fingerprint.outputs.hash }}
            ghcr.io/${{ github.repository }}-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
