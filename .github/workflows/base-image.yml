# Build Base Image
# This workflow pre-builds a Docker image containing all heavy system dependencies
# (Chromium, Node.js, Fonts, Graphviz) to accelerate subsequent CI runs.
name: Build Base Image

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches: ["main"]
    # Trigger only when dependency-related files or this workflow change
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/base-image.yml'

jobs:
  build-base:
    # Runs on Ubuntu, building for both AMD64 and ARM64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Base Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: base # Specifically builds the 'base' stage of the Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-base:latest
          # Use GHA cache to speed up multi-stage dependency installs
          cache-from: type=gha
          cache-to: type=gha,mode=max
