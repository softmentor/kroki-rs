# Docker CI (Verification Only)
# This workflow performs fast verification of the Docker image on every push to main or PR.
# It leverages the pre-built 'base' image to achieve sub-minute run times.
# Note: This workflow does NOT push images to the registry. Distribution is handled by release.yml.
name: Docker CI

on:
  push:
    branches: [ "main" ] # Only verify on main for stability checks
  pull_request:
    branches: [ "main" ] # Verify PRs before they are merged

jobs:
  build-and-test-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required for pulling from private/internal registries
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Load Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # Leverage the pre-built base image for extreme speed (< 30s build)
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository }}-base:latest
          load: true # Ensures image is placed into local Docker daemon for testing
          tags: kroki-rs:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Image and Admin Health Endpoint
        run: |
          # 1. Start the container in the background
          docker run -d --name kroki-test -p 8000:8000 -p 8081:8081 kroki-rs:ci-test
          
          # 2. Wait for server startup
          sleep 5
          
          # 3. Test Health Check API (Admin Port)
          echo "Testing Health Endpoint..."
          curl --fail -s http://localhost:8081/health > result.json
          cat result.json
          if ! grep -q '"status":"ok"' result.json; then
            echo "Health check failed!"
            docker logs kroki-test
            exit 1
          fi
          
          # 4. Test Mermaid Rendering (Main API Port)
          # Uses a properly compressed/encoded "graph TD; A-->B;" payload
          echo "Testing Playwright/Mermaid Integration..."
          HTTP_CODE=$(curl -s -o mermaid.svg -w "%{http_code}" http://localhost:8000/mermaid/svg/eJxLL0osyFAIcbHmUnDU1bVzsgYALroEhg)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Mermaid rendering failed with HTTP $HTTP_CODE"
            cat mermaid.svg || true
            docker logs kroki-test
            exit 1
          fi
          
          # 5. Verify the SVG output is valid
          if ! grep -q "<svg" mermaid.svg; then
            echo "Invalid SVG output!"
            cat mermaid.svg
            docker logs kroki-test
            exit 1
          fi
          
          echo "Container is healthy!"
          docker logs kroki-test
          docker stop kroki-test

