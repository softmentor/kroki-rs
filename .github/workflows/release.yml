name: Project Release (Tags Only)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Release Binary
    runs-on: macos-latest # Using macos as requested and typical for this project
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies (macOS)
        run: |
          brew install pkg-config cairo pango libpng jpeg giflib librsvg graphviz
          # Install D2 to /usr/local/bin which is usually in PATH
          curl -fsSL https://d2lang.com/install.sh | sudo sh -s --

      - name: Install dependencies
        run: npm install

      - name: Debug Environment
        run: |
          echo "PATH: $PATH"
          which dot || true
          which d2 || true
          ls -l /usr/local/bin/d2 || true
          ls -l node_modules/.bin/bpmn-to-image || true

      - name: Build and Package
        run: make verify

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
