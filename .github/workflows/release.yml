name: Project Release (Tags Only)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Release Binary
    runs-on: macos-latest # Using macos as requested and typical for this project
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies (macOS)
        run: |
          brew install pkg-config cairo pango libpng jpeg-turbo giflib librsvg graphviz d2
          brew install --cask chromium
          
          # Set environment variables for keg-only jpeg-turbo and other dependencies
          echo "PKG_CONFIG_PATH=$(brew --prefix jpeg-turbo)/lib/pkgconfig:$(brew --prefix libpng)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig" >> $GITHUB_ENV
          echo "LDFLAGS=-L$(brew --prefix jpeg-turbo)/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I$(brew --prefix jpeg-turbo)/include" >> $GITHUB_ENV
          echo "$(brew --prefix jpeg-turbo)/bin" >> $GITHUB_PATH
          
          # Force Puppeteer to use the Homebrew Chromium to avoid sandbox hangs
          echo "PUPPETEER_EXECUTABLE_PATH=/Applications/Chromium.app/Contents/MacOS/Chromium" >> $GITHUB_ENV
          echo "PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm install

      - name: Debug Environment
        run: |
          echo "PATH: $PATH"
          which dot || true
          which d2 || true
          ls -l /usr/local/bin/d2 || true
          ls -l node_modules/.bin/bpmn-to-image || true

      - name: Configure CI Timeouts
        run: |
          cat <<EOF > ci-kroki.toml
          [server]
          timeout_ms = 10000
          [graphviz]
          timeout_ms = 10000
          [mermaid]
          timeout_ms = 10000
          [plantuml]
          timeout_ms = 10000
          [vega]
          timeout_ms = 10000
          [vegalite]
          timeout_ms = 10000
          [wavedrom]
          timeout_ms = 10000
          [bpmn]
          timeout_ms = 10000
          [d2]
          timeout_ms = 10000
          [ditaa]
          timeout_ms = 10000
          [excalidraw]
          timeout_ms = 10000
          EOF
          echo "KROKI_CONFIG=$(pwd)/ci-kroki.toml" >> $GITHUB_ENV

      - name: Build and Package
        run: |
          export PATH=$PATH:$(pwd)/node_modules/.bin
          make verify

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
