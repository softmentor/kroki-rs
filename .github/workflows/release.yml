# Project Release (Tags Only)
# This workflow is the single source of truth for distribution. 
# It handles Binaries, GitHub Releases, and officially tagged Docker Images.
name: Project Release (Tags Only)

on:
  push:
    tags:
      - 'v*' # Trigger on any version tag (e.g., v0.0.3)
  workflow_dispatch: # Allows manual trigger if needed

jobs:
  # Job 0: Compute CI Fingerprint to pull correct image
  fingerprint:
    runs-on: ubuntu-latest
    outputs:
      hash: ${{ steps.calc.outputs.hash }}
  # ---------------------------------------------------------------------------
    steps:
      - uses: actions/checkout@v4
      - name: Compute Target CI Hash
        id: calc
        run: |
          HASH=$(make -s print-base-fingerprint)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

  # Job 1: Build binaries for all supported platforms
  release:
    needs: fingerprint
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: kroki-rs-macos
            use_container: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: kroki-rs-linux-amd64
            use_container: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: kroki-rs-linux-arm64
            use_container: true

    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.use_container && format('ghcr.io/{0}-ci:{1}', github.repository, needs.fingerprint.outputs.hash) || '' }}
      options: --user root
    env:
      IS_CONTAINER: ${{ matrix.use_container }}
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Verify Version Synchronicity
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          chmod +x src-scripts/ci-verify/repro-ci.sh
          ./src-scripts/ci-verify/repro-ci.sh --version-check

      - name: Setup Environment (Native)
        if: matrix.use_container == false
        uses: ./.github/actions/setup-kroki
        with:
          rust-targets: ${{ matrix.target }}
          install-node: 'false'
          use-cache: 'true'

      - name: Build Binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          # Use container's pre-installed toolchain and cross-linkers where possible
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
             # Ensure the ARM64 toolchain is added if not default
             rustup target add ${{ matrix.target }}
             cargo build --release --target ${{ matrix.target }}
          else
            make release
          fi
          mkdir -p dist
          cp target/${{ matrix.target }}/release/kroki-rs dist/${{ matrix.artifact_name }} || cp target/release/kroki-rs dist/${{ matrix.artifact_name }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  publish:
    name: Publish Release
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Assets
        run: |
          mkdir dist
          # Repackage files for release with version naming
          cp artifacts/kroki-rs-macos/kroki-rs-macos dist/kroki-rs-macos
          cp artifacts/kroki-rs-linux-amd64/kroki-rs-linux-amd64 dist/kroki-rs-linux-amd64
          cp artifacts/kroki-rs-linux-arm64/kroki-rs-linux-arm64 dist/kroki-rs-linux-arm64
          chmod +x dist/*
          cd dist
          tar -czvf kroki-rs-macos.tar.gz kroki-rs-macos
          tar -czvf kroki-rs-linux-amd64.tar.gz kroki-rs-linux-amd64
          tar -czvf kroki-rs-linux-arm64.tar.gz kroki-rs-linux-arm64
          shasum -a 256 *.tar.gz > checksums.sha256

      - name: Generate Release Report
        run: |
          chmod +x src-scripts/gh-tasks/generate-release-report.sh
          ./src-scripts/gh-tasks/generate-release-report.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.sha256
            release-report-*.md
          draft: false
          prerelease: false
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}

      - name: Tag @latest
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Commit Cumulative Report
        continue-on-error: true
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main:main
          git checkout main
          # Re-run report generation on the latest main branch
          chmod +x src-scripts/gh-tasks/generate-release-report.sh
          ./src-scripts/gh-tasks/generate-release-report.sh "${GITHUB_REF_NAME#v}"
          git add release-reports.md
          git commit -m "docs: update cumulative release reports for ${GITHUB_REF_NAME}" || echo "No changes to report"
          git push origin main

  # Job 4: Deploy documentation only after all artifacts are published
  pages:
    name: Deploy Documentation
    needs: [publish]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-kroki
        with:
          install-node: 'true'
          install-nextest: 'false'

      - name: Build Rustdoc
        run: make doc

      - name: Build MyST
        run: npx mystmd build --html
        working-directory: docs
        env:
          BASE_URL: "/kroki-rs"

      - name: Merge Docs
        run: |
          mkdir -p docs/_build/html/rustdoc
          cp -r target/doc/* docs/_build/html/rustdoc/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
