# Project Release (Tags Only)
# This workflow is the single source of truth for distribution. 
# It handles Binaries, GitHub Releases, and officially tagged Docker Images.
name: Project Release (Tags Only)

on:
  push:
    tags:
      - 'v*' # Trigger on any version tag (e.g., v0.0.3)
  workflow_dispatch: # Allows manual trigger if needed

jobs:
  # Job 1: Build binaries for all supported platforms
  release:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: kroki-rs-macos
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: kroki-rs-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: kroki-rs-linux-arm64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Verify Version Synchronicity
        run: |
          chmod +x src-scripts/ci-verify/repro-ci.sh
          ./src-scripts/ci-verify/repro-ci.sh --version-check

      - name: Setup Environment
        uses: ./.github/actions/setup-kroki
        with:
          rust-targets: ${{ matrix.target }}
          install-node: 'false'
          install-playwright: ${{ matrix.os == 'ubuntu-latest' && matrix.target != 'aarch64-unknown-linux-gnu' && 'true' || 'false' }}
          use-cache: 'false'

      - name: Set up QEMU (ARM64 only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: docker/setup-qemu-action@v3

      - name: Install ARM64 Cross Linker (Linux ARM64 only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build Binary
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cargo build --release --target ${{ matrix.target }}
          else
            make release
          fi
          mkdir -p dist
          cp target/${{ matrix.target }}/release/kroki-rs dist/${{ matrix.artifact_name }} || cp target/release/kroki-rs dist/${{ matrix.artifact_name }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  publish:
    name: Publish Release
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Assets
        run: |
          mkdir dist
          # Repackage files for release with version naming
          cp artifacts/kroki-rs-macos/kroki-rs-macos dist/kroki-rs-macos
          cp artifacts/kroki-rs-linux-amd64/kroki-rs-linux-amd64 dist/kroki-rs-linux-amd64
          cp artifacts/kroki-rs-linux-arm64/kroki-rs-linux-arm64 dist/kroki-rs-linux-arm64
          chmod +x dist/*
          cd dist
          tar -czvf kroki-rs-macos.tar.gz kroki-rs-macos
          tar -czvf kroki-rs-linux-amd64.tar.gz kroki-rs-linux-amd64
          tar -czvf kroki-rs-linux-arm64.tar.gz kroki-rs-linux-arm64
          shasum -a 256 *.tar.gz > checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.sha256
          draft: false
          prerelease: false
          generate_release_notes: true

  # Job 4: Deploy documentation only after all artifacts are published
  pages:
    name: Deploy Documentation
    needs: [publish]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-kroki
        with:
          install-node: 'true'
          install-playwright: 'false'

      - name: Build Rustdoc
        run: make doc

      - name: Setup MyST
        run: npm install -g mystmd

      - name: Build MyST
        run: myst build --html
        working-directory: docs
        env:
          BASE_URL: "/kroki-rs"

      - name: Merge Docs
        run: |
          mkdir -p docs/_build/html/rustdoc
          cp -r target/doc/* docs/_build/html/rustdoc/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
