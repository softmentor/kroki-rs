# Documentation Deployment (Manual Only)
# Use this workflow to rebuild and deploy documentation without a full release.
# For tagged releases, docs are deployed atomically via release.yml.
name: Doc Deployment (Manual)

on:
  workflow_dispatch: # Manual trigger only

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Environment
        uses: ./.github/actions/setup-kroki
        with:
          install-node: 'true'

      - name: Build Rustdoc
        run: make doc

      - name: Setup MyST
        run: npm install -g mystmd

      - name: Build MyST
        run: myst build --html
        working-directory: docs
        env:
          BASE_URL: "/kroki-rs"

      - name: Merge Docs
        run: |
          mkdir -p docs/_build/html/rustdoc
          cp -r target/doc/* docs/_build/html/rustdoc/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
