# Doc Deployment (Tags Only)
# This workflow builds and deploys the project documentation (Rustdoc + MyST) to GitHub Pages.
# It is synchronized with releases to ensure documentation reflects the currently released version.
name: Doc Deployment (Tags Only)

on:
  push:
    tags:
      - 'v*' # Trigger on any version tag (e.g., v0.0.3)
  workflow_dispatch: # Allows manual trigger from UI

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Rustdoc
        run: make doc

      - name: Setup MyST
        run: npm install -g mystmd

      - name: Build MyST
        run: myst build --html
        working-directory: docs
        env:
          BASE_URL: "/kroki-rs"

      - name: Merge Docs
        run: |
          mkdir -p docs/_build/html/rustdoc
          cp -r target/doc/* docs/_build/html/rustdoc/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
