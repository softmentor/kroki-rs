name: 'Setup Kroki'
description: 'Standard setup for Rust, Node.js, and System Dependencies'

inputs:
  rust-targets:
    description: 'Rust targets to install'
    required: false
    default: ''
  node-version:
    description: 'Node.js version'
    required: false
    default: '22'
  install-node:
    description: 'Whether to install Node.js and npm dependencies'
    required: false
    default: 'false'
  install-nextest:
    description: 'Whether to install cargo-nextest'
    required: false
    default: 'true'
  use-cache:
    description: 'Whether to use Rust cache (set to false for fresh builds)'
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:
    - name: Setup Node (if needed)
      if: inputs.install-node == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install system dependencies for canvas and rendering
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          sudo apt-get update
          PKGS="build-essential libssl-dev libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev graphviz chromium-browser"
          sudo apt-get install -y $PKGS
        elif [ "$RUNNER_OS" == "macOS" ]; then
          brew install pkg-config cairo pango libpng jpeg-turbo giflib librsvg graphviz
        fi

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.rust-targets }}

    - name: Setup Rust Cache
      if: inputs.use-cache == 'true'
      uses: Swatinem/rust-cache@v2

    - name: Install NPM dependencies (if needed)
      if: inputs.install-node == 'true' && (hashFiles('package-lock.json') != '' || hashFiles('npm-shrinkwrap.json') != '')
      shell: bash
      run: npm ci

    - name: Install nextest (if needed)
      if: inputs.install-nextest == 'true'
      uses: taiki-e/install-action@nextest
